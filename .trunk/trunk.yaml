version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      uri: https://github.com/trunk-io/plugins
      ref: v1.7.6
    - id: configs
      local: .
lint:
  disabled:
    - markdown-link-check
  ignore:
    - linters:
        - markdownlint
        - prettier
      paths:
        - CHANGELOG.md
    - linters:
        - prettier
        - yamlfmt
        - yamllint
        - markdownlint
        - shellcheck
        - shfmt
      paths:
        - .flama/**
        - .paperclip/**
        - .github/workflows/flama-*.yml
        - .github/dependabot.yml
        - .github/CODEOWNERS
        - .release-please-config.json
        - .release-please-manifest.json
        - scripts/delivery
