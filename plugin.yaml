---
# Navigaite Trunk Plugin
# Centralized linting, formatting, and security configuration for all Navigaite projects.
# https://github.com/navigaite/nvgt-trunk-plugin
version: 0.1
required_trunk_version: '>= 1.22.0'
cli:
  version: 1.22.12
# Applicable linters and actions will run with these runtime versions
runtimes:
  enabled:
    - go@1.23.6
    - node@25.9.0
    - python@3.13.3
    - ruby@3.4.2
lint:
  definitions:
    - name: eslint
      commands:
        - name: lint
          run_when: [cli, monitor, ci] # do not run from lsp (may be too slow)
  enabled:
    # --- JavaScript / TypeScript ---
    - eslint@10.9.1
    - prettier@3.9.6:
        packages:
          - prettier-plugin-tailwindcss@0.8.1
    - stylelint@17.14.1:
        packages:
          - stylelint-config-standard@40.0.0
          - stylelint-config-tailwindcss@1.0.1
          - stylelint-config-clean-order@10.0.0
    - sort-package-json@4.0.0
    - svgo@4.1.0
    # --- Python (ruff replaces black, isort, pylint, bandit, flake8) ---
    - ruff@0.16.5
    - mypy@2.3.1
    # --- Go ---
    - gofmt@1.20.4
    - golangci-lint@2.13.2
    # --- Ruby ---
    - rubocop@1.39.0
    # --- Rust ---
    - rustfmt@1.68.2
    - clippy@1.71.1
    # --- C/C++ ---
    - clang-format@17.0.1
    - clang-tidy@17.0.1
    - pragma-once
    # --- Shell ---
    - shellcheck@0.11.0
    - shfmt@3.6.0
    # --- Docker ---
    - hadolint@2.15.1
    # --- Infrastructure as Code ---
    - checkov@3.3.16
    - terrascan@1.19.9
    - cfnlint@1.55.1
    - buildifier@8.5.1
    # --- Data formats ---
    - yamlfmt@0.21.0
    - yamllint@1.38.0
    - taplo@0.10.0
    - sql-formatter@15.8.2
    - prisma@8.0.0-rc.12
    # --- Documentation ---
    - markdownlint@0.49.1
    - markdown-link-check@3.13.7
    # --- Security ---
    - trufflehog@3.97.1
    - semgrep@1.175.0
    - osv-scanner@2.5.1
    # --- CI / Config ---
    - actionlint@1.7.12
    - renovate@44.52.1
    - dotenv-linter@4.0.0
    - dustilock@1.2.0
    - nancy@2.1.0
    - buf-lint@1.31.0!
    # --- Images ---
    - oxipng@10.2.0
    # --- Git ---
    - git-diff-check
  # Sourcing repos will have these configs available to applicable linters
  exported_configs:
    - configs:
        - configs/.checkov.yaml
        - configs/.cspell.json
        - configs/.hadolint.yaml
        - configs/.yamlfmt
        - configs/.markdownlint.yaml
        - configs/.npmcheckrc
        - configs/.prettierignore
        - configs/.prettierrc
        - configs/.remarkrc.yaml
        - configs/.shellcheckrc
        - configs/.sqlfluff
        - configs/.stylelintrc.json
        - configs/.yamllint.yaml
        - configs/biome.json
        - configs/ruff.toml
        - configs/rustfmt.toml
        - configs/svgo.config.mjs
  ignore:
    - linters: [trufflehog, osv-scanner]
      paths: [package-lock.json]
    # yamlfmt is the single owner of YAML formatting. Prettier and yamlfmt both
    # wrap at 120 columns but with different algorithms, so certain YAML files
    # ping-pong between the two formatters and trunk's autofix loop aborts after
    # 10 iterations ("Incorrect formatting" from both). Excluding YAML from
    # prettier here fixes this org-wide; per-file trunk-ignore-all(prettier,yamlfmt)
    # headers in consumer repos are band-aids that can be removed over time.
    - linters: [prettier]
      paths:
        - '**/*.yaml'
        - '**/*.yml'
# By sourcing this plugin, repos will enable these actions
actions:
  definitions:
    # Trunk's git hooks take over `core.hooksPath` for the whole repo, so the
    # machine-local `~/.git-hooks/pre-push` guards stop running in every repo
    # that sources this plugin. Those guards refuse two things that the org
    # gates reject anyway, but hours later and with no useful message: a
    # committer identity that fails `required_signatures`, and a direct push to
    # a protected branch. Re-running them as a Trunk action is the supported
    # way to get them back — it survives `trunk upgrade` and
    # `trunk git-hooks sync`, unlike patching the generated hook script.
    #
    # The guards are machine-local policy (they encode this fleet's verified
    # signing identity and branching model), so the action exits 0 when the
    # file is absent. A contributor without it is simply unguarded locally and
    # still blocked server-side, which is the correct outcome.
    - id: navigaite-push-guard
      display_name: Navigaite Push Guard
      description: Refuse pushes the delivery gates would reject (signing, branch target)
      # `interactive: optional` — NOT `true`. An `interactive: true` action is
      # skipped in non-interactive contexts, which is exactly how automation and
      # coding agents push, i.e. the case this guard exists for.
      interactive: optional
      # `origin` is omitted deliberately: the guard defaults its remote to
      # origin, and spelling it out pushes this line past yamllint's 120-char
      # limit — which yamlfmt then refuses to fold back. Keep it on one line.
      run: bash -c 'g="$HOME/.git-hooks/pre-push"; [ -x "$g" ] || exit 0; exec "$g" <"$1"' -- '${hook_stdin_path}'
      triggers:
        - git_hooks: [pre-push]
  enabled:
    - trunk-announce
    - trunk-cache-prune
    - trunk-upgrade-available
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - navigaite-push-guard
