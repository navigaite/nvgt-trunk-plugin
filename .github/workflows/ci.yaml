---
# Navigaite Universal CI/CD Pipeline
# Uses shared reusable workflow from navigaite/.github

name: Navigaite Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  pull-requests: write
  deployments: write
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  pipeline:
    uses: maxbec/pipeline/.github/workflows/universal-pipeline.yaml@d9bb4a2895dbe89310bd83e4a114e6678c01d59c # v4.0.1
    with:
      config-file: .github/pipeline.yaml
      skip-security: ${{ github.event_name != 'pull_request' }}
    # Org secrets do not cross the owner boundary via `secrets: inherit`
    # (pipeline lives in maxbec/pipeline) — forward them explicitly.
    secrets:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      WORKFLOW_APP_ID: ${{ secrets.WORKFLOW_APP_ID }}
      WORKFLOW_APP_PRIVATE_KEY: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  check-gate:
    name: Check Gate
    if: always()
    needs: [pipeline]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate pipeline result
        shell: bash
        env:
          RESULT: ${{ needs.pipeline.result }}
        run: |
          set -euo pipefail
          echo "Pipeline result: $RESULT"
          case "$RESULT" in
            success|skipped) echo "✅ Pipeline passed" ;;
            *) echo "::error::Pipeline failed (result: $RESULT)"; exit 1 ;;
          esac

  # Required by org ruleset — this repo has no dev branch, so all PRs target main directly
  branch-guard:
    name: Branch Guard
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: ✅ Allow PR
        run: echo "✅ Single-branch repo — all PRs target main directly"