name: Flama Policy

on:
  pull_request:
    branches: [main]

permissions:
  checks: read
  contents: read

jobs:
  policy:
    uses: maxbec/flama-delivery-platform/.github/workflows/reusable-policy.yml@a34f976e94c462dcbde5dc6c75c913b324643ef8
    with:
      base-sha: ${{ github.event.pull_request.base.sha }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      paperclip-app-slug: flama-delivery-navigaite
      platform-sha: a34f976e94c462dcbde5dc6c75c913b324643ef8
      profile: fast
      runner-labels: ${{ vars.PIPELINE_RUNNER || '["ubuntu-latest"]' }}
