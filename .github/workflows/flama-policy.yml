name: Flama Policy

on:
  pull_request:
    branches: [main]

permissions:
  checks: read
  contents: read

jobs:
  policy:
    uses: maxbec/flama-delivery-platform/.github/workflows/reusable-policy.yml@5764805c7c847c910bc6527a800e01a399644589
    with:
      base-sha: ${{ github.event.pull_request.base.sha }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      paperclip-app-slug: flama-delivery-navigaite
      platform-sha: 5764805c7c847c910bc6527a800e01a399644589
      profile: fast
      runner-labels: ${{ vars.PIPELINE_RUNNER || '["ubuntu-latest"]' }}
