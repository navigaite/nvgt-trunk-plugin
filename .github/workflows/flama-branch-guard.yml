name: Flama Branch Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  branch-guard:
    uses: maxbec/flama-delivery-platform/.github/workflows/reusable-branch-guard.yml@5764805c7c847c910bc6527a800e01a399644589
    with:
      head-sha: ${{ github.event.pull_request.head.sha }}
      profile: fast
      runner-labels: ${{ vars.PIPELINE_RUNNER || '["ubuntu-latest"]' }}
