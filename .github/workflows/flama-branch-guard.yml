name: Flama Branch Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  branch-guard:
    uses: maxbec/flama-delivery-platform/.github/workflows/reusable-branch-guard.yml@238d815bcd48d9d767bf3b07fb0283ce31c52110
    with:
      head-sha: ${{ github.event.pull_request.head.sha }}
      profile: fast
