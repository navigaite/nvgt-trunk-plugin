name: Flama Final

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  final:
    uses: maxbec/flama-delivery-platform/.github/workflows/reusable-final.yml@5764805c7c847c910bc6527a800e01a399644589
    with:
      base-sha: ${{ github.event.pull_request.base.sha }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      platform-sha: 5764805c7c847c910bc6527a800e01a399644589
      runner-labels: ${{ vars.PIPELINE_RUNNER || '["ubuntu-latest"]' }}
