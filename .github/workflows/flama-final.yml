name: Flama Final

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  final:
    uses: maxbec/flama-delivery-platform/.github/workflows/reusable-final.yml@34337804b379ae4342efc6e38890dad8268eaa73
    with:
      base-sha: ${{ github.event.pull_request.base.sha }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      platform-sha: a34f976e94c462dcbde5dc6c75c913b324643ef8
      runner-labels: ${{ vars.PIPELINE_RUNNER || '["ubuntu-latest"]' }}
